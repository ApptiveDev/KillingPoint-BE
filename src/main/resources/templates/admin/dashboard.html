<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #f4f4f1;
            color: #1a1a17;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            background: #f4f4f1;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            width: 240px;
            min-height: 100vh;
            padding: 24px 18px;
            background: #121210;
            color: #ededea;
        }

        .logo {
            display: block;
            width: 98px;
            height: auto;
            margin: 0 0 36px;
        }

        .nav-group {
            margin: 10px 0 8px;
            color: #6e6e68;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 12px 10px;
            border-left: 3px solid #c7f23f;
            background: #1c1c19;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .nav-dot {
            width: 7px;
            height: 7px;
            background: #c7f23f;
        }

        .sidebar-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid #262624;
        }

        .sidebar-user {
            flex: 1;
            min-width: 0;
        }

        .sidebar-user strong {
            display: block;
            color: #ededea;
            font-size: 13px;
            font-weight: 700;
        }

        .sidebar-user span {
            display: block;
            margin-top: 3px;
            color: #6e6e68;
            font-size: 11px;
        }

        .sidebar-logout {
            padding: 7px 9px;
            border: 1px solid #2e2e2c;
            border-radius: 0;
            background: transparent;
            color: #9a9a92;
            font-size: 12px;
        }

        .sidebar-logout:hover {
            border-color: #444;
            color: #ededea;
        }

        .content {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 62px;
            padding: 0 30px;
            border-bottom: 1px solid #e7e7e2;
            background: #fff;
        }

        .title {
            margin: 0;
            color: #16160f;
            font-size: 18px;
            font-weight: 800;
        }

        .title-desc {
            color: #8a8a82;
            font-size: 13px;
            font-weight: 500;
        }

        .workspace {
            flex: 1;
            overflow-y: auto;
            padding: 26px 30px 60px;
        }

        .ugc-shell {
            max-width: 1280px;
            margin: 0 auto;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .search-form {
            display: flex;
            flex: 1;
            align-items: center;
            gap: 8px;
            min-width: 420px;
            flex-wrap: wrap;
        }

        .search-type-tabs {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid #e2e2dc;
            background: #fff;
        }

        .search-type-option {
            position: relative;
        }

        .search-type-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .search-type-option span {
            display: block;
            padding: 7px 11px;
            color: #7e7e76;
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
        }

        .search-type-option input:checked + span {
            background: #16160f;
            color: #fff;
        }

        .search-box {
            display: flex;
            flex: 1;
            align-items: center;
            gap: 9px;
            min-width: 260px;
            max-width: 420px;
            padding: 10px 13px;
            border: 1px solid #e2e2dc;
            background: #fff;
        }

        .search-box:focus-within {
            border-color: #16160f;
        }

        .search-box input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #16160f;
            font-size: 14px;
        }

        .search-button {
            padding: 10px 14px;
            border: 0;
            background: #c7f23f;
            color: #16170b;
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .filter-tabs {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid #e2e2dc;
            background: #fff;
        }

        .filter-tab {
            display: block;
            padding: 7px 13px;
            border: 0;
            background: transparent;
            color: #7e7e76;
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
        }

        .filter-tab.is-active {
            background: #16160f;
            color: #fff;
            font-weight: 800;
        }

        .ugc-grid {
            display: grid;
            align-items: start;
            grid-template-columns: 1.35fr 1fr;
            gap: 18px;
        }

        .panel {
            overflow: hidden;
            border: 1px solid #e7e7e2;
            background: #fff;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 16px;
            border-bottom: 1px solid #efefea;
        }

        .panel-title {
            color: #16160f;
            font-size: 13px;
            font-weight: 800;
        }

        .panel-count {
            color: #9a9a92;
            font-size: 11px;
        }

        .ugc-list {
            max-height: 620px;
            overflow-y: auto;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid #efefea;
            background: #fcfcfb;
        }

        .page-status {
            color: #8a8a82;
            font-size: 12px;
            white-space: nowrap;
        }

        .page-actions {
            display: flex;
            gap: 6px;
        }

        .page-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            padding: 7px 10px;
            border: 1px solid #e2e2dc;
            background: #fff;
            color: #5a5a54;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .page-link:hover {
            border-color: #16160f;
            color: #16160f;
        }

        .page-link.is-disabled {
            pointer-events: none;
            color: #b6b6ae;
            background: #f4f4f1;
        }

        .ugc-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 15px;
            border: 0;
            border-bottom: 1px solid #f1f1ed;
            border-left: 3px solid transparent;
            background: #fff;
            text-align: left;
        }

        .ugc-row.is-selected {
            border-left-color: #c7f23f;
            background: #fbfcf6;
        }

        .ugc-row.is-hidden {
            display: none;
        }

        .thumb {
            flex: 0 0 58px;
            width: 58px;
            height: 38px;
            border: 1px solid #e2e2dc;
            background: #ecece6;
            object-fit: cover;
        }

        .row-main {
            flex: 1;
            min-width: 0;
        }

        .row-line {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .song {
            overflow: hidden;
            max-width: 210px;
            color: #1a1a17;
            font-size: 13.5px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row-sub {
            display: block;
            overflow: hidden;
            margin-top: 2px;
            color: #8a8a82;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row-meta {
            display: flex;
            flex: 0 0 auto;
            align-items: flex-end;
            flex-direction: column;
            gap: 5px;
        }

        .row-time {
            color: #9a9a92;
            font-size: 11px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border: 1px solid #d2e6a6;
            background: #f0f7e3;
            color: #5a6b12;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status.reported {
            border-color: #ecc3bc;
            background: #fdf1ef;
            color: #bf4a3c;
        }

        .status.broken {
            border-color: #ead9a8;
            background: #fbf3e2;
            color: #9a6512;
        }

        .detail-panel {
            position: sticky;
            top: 0;
        }

        .player {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #16160f;
        }

        .player iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .segment-chip {
            position: absolute;
            top: 11px;
            left: 11px;
            padding: 3px 8px;
            background: #c7f23f;
            color: #16170b;
            font-size: 10px;
            font-weight: 700;
        }

        .detail-body {
            padding: 18px;
        }

        .detail-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .detail-song {
            color: #16160f;
            font-size: 16px;
            font-weight: 900;
        }

        .detail-artist {
            margin-top: 2px;
            color: #8a8a82;
            font-size: 13px;
        }

        .secondary-button {
            padding: 7px 11px;
            border: 1px solid #e2e2dc;
            background: #fff;
            color: #5a5a54;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .secondary-button:hover {
            border-color: #16160f;
            color: #16160f;
        }

        .field-stack {
            display: flex;
            flex-direction: column;
            gap: 13px;
            margin-top: 16px;
        }

        .field-label {
            display: block;
            color: #8a8a82;
            font-size: 11px;
            font-weight: 800;
        }

        .memo-input {
            width: 100%;
            margin-top: 6px;
            padding: 9px 11px;
            border: 1px solid #e2e2dc;
            outline: 0;
            background: #fcfcfb;
            color: #1a1a17;
            font-size: 13.5px;
        }

        .memo-input:focus {
            border-color: #16160f;
            background: #fff;
        }

        .memo-input {
            min-height: 68px;
            resize: vertical;
        }

        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .action-row form,
        .action-row > button {
            flex: 1;
        }

        .save-button,
        .danger-button {
            width: 100%;
            padding: 11px;
            font-size: 13.5px;
            font-weight: 900;
        }

        .save-button {
            border: 0;
            background: #c7f23f;
            color: #16170b;
        }

        .save-button:hover {
            background: #bce92f;
        }

        .danger-button {
            border: 1px solid #ecc3bc;
            background: #fdf6f5;
            color: #bf4a3c;
        }

        .audit-note {
            margin-top: 13px;
            padding-top: 11px;
            border-top: 1px solid #efefea;
            color: #a6a69e;
            font-size: 10px;
            line-height: 1.6;
        }

        .empty-state {
            padding: 40px;
            color: #b6b6ae;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 1040px) {
            .ugc-grid {
                grid-template-columns: 1fr;
            }

            .detail-panel {
                position: static;
            }
        }

        @media (max-width: 780px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .content {
                min-height: auto;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px 20px;
            }

            .workspace {
                padding: 22px 20px 42px;
            }

            .toolbar,
            .filter-tabs,
            .search-form,
            .search-box,
            .search-type-tabs {
                width: 100%;
                max-width: none;
                min-width: 0;
            }

            .filter-tab,
            .search-type-option {
                flex: 1;
            }

            .search-type-option span,
            .search-button {
                text-align: center;
                width: 100%;
            }

            .detail-head,
            .action-row {
                flex-direction: column;
            }

            .row-meta {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<main class="layout">
    <aside class="sidebar">
        <img class="logo" th:src="@{/admin/images/killing-part-logo.svg}" alt="Killing Part">
        <div class="nav-group">운영</div>
        <span class="nav-item"><span class="nav-dot"></span>UGC 검수</span>
        <form class="sidebar-footer" th:action="@{/admin/logout}" method="post">
            <div class="sidebar-user">
                <strong>admin</strong>
                <span>단일 관리자</span>
            </div>
            <button class="sidebar-logout" type="submit">나가기</button>
        </form>
    </aside>

    <section class="content">
        <header class="topbar">
            <h1 class="title">UGC 검수</h1>
        </header>

        <section class="workspace">
            <div class="ugc-shell">
                <div class="toolbar">
                    <form class="search-form" th:action="@{/admin/dashboard}" method="get">
                        <input type="hidden" name="filter" th:value="${ugcFilter}">
                        <input type="hidden" name="size" th:value="${pageSize}">
                        <div class="search-type-tabs" aria-label="검색 조건">
                            <label class="search-type-option" th:each="type : ${ugcSearchTypes}">
                                <input type="radio" name="searchType" th:value="${type.name()}" th:checked="${type == ugcSearchType}">
                                <span th:text="${type.label}">검색 조건</span>
                            </label>
                        </div>
                        <label class="search-box" aria-label="UGC 검색어">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a92" stroke-width="2" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"></circle>
                                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                            </svg>
                            <input id="ugcSearch" name="q" type="search" th:value="${ugcQuery}" placeholder="검색어 입력">
                        </label>
                        <button class="search-button" type="submit">검색</button>
                    </form>

                    <div class="filter-tabs" aria-label="UGC 필터">
                        <a class="filter-tab" th:classappend="${ugcFilter == 'reported'} ? ' is-active' : ''" th:href="@{/admin/dashboard(filter='reported', page=0, size=${pageSize}, searchType=${ugcSearchType.name()}, q=${ugcQuery})}">신고/깨짐</a>
                        <a class="filter-tab" th:classappend="${ugcFilter == 'all'} ? ' is-active' : ''" th:href="@{/admin/dashboard(filter='all', page=0, size=${pageSize}, searchType=${ugcSearchType.name()}, q=${ugcQuery})}">전체</a>
                    </div>
                </div>

                <div class="ugc-grid">
                    <section class="panel">
                        <div class="panel-header">
                            <span class="panel-title">전체 공개 킬링파트</span>
                            <span class="panel-count" id="ugcCount" th:text="'총 ' + ${ugcPage.totalElements} + '건'">총 0건</span>
                        </div>
                        <div class="ugc-list" id="ugcList">
                            <button class="ugc-row" th:each="ugc, iter : ${ugcItems}" th:classappend="${iter.index == 0} ? ' is-selected' : ''" type="button"
                                    th:data-filter-state="${ugc.filterState}"
                                    th:data-diary-id="${ugc.id}"
                                    th:data-id="${ugc.displayId}"
                                    th:data-song="${ugc.musicTitle}"
                                    th:data-artist="${ugc.artist}"
                                    th:data-video-url="${ugc.videoUrl}"
                                    th:data-user="${ugc.username}"
                                    th:data-user-id="${ugc.userId}"
                                    th:data-platform="${ugc.scopeLabel}"
                                    th:data-segment="${ugc.segment}"
                                    th:data-registered="${ugc.registeredLabel}"
                                    th:data-memo-action="@{/admin/dashboard/{diaryId}/memo(diaryId=${ugc.id})}"
                                    th:data-delete-action="@{/admin/dashboard/{diaryId}/delete(diaryId=${ugc.id})}"
                                    data-memo="">
                                <img class="thumb" th:src="${ugc.albumImageUrl}" th:alt="${ugc.musicTitle}">
                                <span class="row-main">
                                    <span class="row-line">
                                        <span class="song" th:text="${ugc.musicTitle}">음악 제목</span>
                                    </span>
                                    <span class="row-sub" th:text="|${ugc.artist} · ${ugc.username}|">아티스트 · 작성자</span>
                                </span>
                                <span class="row-meta">
                                    <span class="row-time" th:text="${ugc.registeredLabel}">방금 전</span>
                                    <span class="status" th:classappend="${ugc.statusClass}" th:text="${ugc.statusLabel}">공개</span>
                                </span>
                            </button>

                            <div class="empty-state" id="emptyState" th:hidden="${!#lists.isEmpty(ugcItems)}">조건에 맞는 킬링파트가 없습니다</div>
                        </div>
                        <nav class="pagination" th:if="${ugcPage.totalPages > 0}" aria-label="UGC 페이지">
                            <span class="page-status" th:text="|${ugcPage.number + 1} / ${ugcPage.totalPages} 페이지|">1 / 1 페이지</span>
                            <div class="page-actions">
                                <a class="page-link" th:classappend="${ugcPage.first} ? ' is-disabled' : ''" th:href="@{/admin/dashboard(filter=${ugcFilter}, page=${ugcPage.number - 1}, size=${pageSize}, searchType=${ugcSearchType.name()}, q=${ugcQuery})}">이전</a>
                                <a class="page-link" th:classappend="${ugcPage.last} ? ' is-disabled' : ''" th:href="@{/admin/dashboard(filter=${ugcFilter}, page=${ugcPage.number + 1}, size=${pageSize}, searchType=${ugcSearchType.name()}, q=${ugcQuery})}">다음</a>
                            </div>
                        </nav>
                    </section>

                    <section class="panel detail-panel" th:if="${selectedUgc != null}">
                        <div class="player">
                            <iframe id="detailVideo"
                                    th:src="${selectedUgc.videoUrl}"
                                    th:title="${selectedUgc.musicTitle}"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    allowfullscreen></iframe>
                            <span class="segment-chip" id="detailSegment" th:text="|구간 ${selectedUgc.segment} 자동 재생|">구간 자동 재생</span>
                        </div>

                        <div class="detail-body">
                            <div class="detail-head">
                                <div>
                                    <div class="detail-song" id="detailSong" th:text="${selectedUgc.musicTitle}">음악 제목</div>
                                    <div class="detail-artist" id="detailArtist" th:text="${selectedUgc.artist}">아티스트</div>
                                </div>
                                <button class="secondary-button" type="button" id="detailUserButton" th:text="|${selectedUgc.username} →|">유저 정보 →</button>
                            </div>

                            <form id="detailMemoForm" th:action="@{/admin/dashboard/{diaryId}/memo(diaryId=${selectedUgc.id})}" method="post">
                                <input type="hidden" name="page" th:value="${ugcPage.number}">
                                <input type="hidden" name="size" th:value="${pageSize}">
                                <input type="hidden" name="filter" th:value="${ugcFilter}">
                                <input type="hidden" name="searchType" th:value="${ugcSearchType.name()}">
                                <input type="hidden" name="q" th:value="${ugcQuery}">
                                <div class="field-stack">
                                <label>
                                    <span class="field-label">메모</span>
                                    <textarea class="memo-input" id="detailMemo" name="memo" placeholder="내부 메모"></textarea>
                                </label>
                                </div>
                            </form>
                            <form id="detailDeleteForm" th:action="@{/admin/dashboard/{diaryId}/delete(diaryId=${selectedUgc.id})}" method="post">
                                <input type="hidden" name="page" th:value="${ugcPage.number}">
                                <input type="hidden" name="size" th:value="${pageSize}">
                                <input type="hidden" name="filter" th:value="${ugcFilter}">
                                <input type="hidden" name="searchType" th:value="${ugcSearchType.name()}">
                                <input type="hidden" name="q" th:value="${ugcQuery}">
                            </form>
                            <div class="action-row">
                                <button class="save-button" type="submit" form="detailMemoForm">메모 저장</button>
                                <button class="danger-button" type="submit" form="detailDeleteForm">삭제</button>
                            </div>

                            <div class="audit-note" id="detailMeta">
                                등록 <span th:text="${selectedUgc.registeredLabel}">방금 전</span> · 작성자 <span th:text="${selectedUgc.username}">작성자</span> (<span th:text="${selectedUgc.userId}">0</span>) · <span th:text="${selectedUgc.scopeLabel}">전체공개</span><br>
                                메모 저장과 삭제 액션은 운영 기록에 남습니다
                            </div>
                        </div>
                    </section>
                    <section class="panel detail-panel" th:if="${selectedUgc == null}">
                        <div class="empty-state">검수할 킬링파트가 없습니다</div>
                    </section>
                </div>
            </div>
        </section>
    </section>
</main>

<script>
    const rows = Array.from(document.querySelectorAll(".ugc-row"));

    function selectRow(row) {
        rows.forEach(item => item.classList.toggle("is-selected", item === row));
        document.getElementById("detailVideo").src = row.dataset.videoUrl;
        document.getElementById("detailVideo").title = row.dataset.song;
        document.getElementById("detailSegment").textContent = "구간 " + row.dataset.segment + " 자동 재생";
        document.getElementById("detailSong").textContent = row.dataset.song;
        document.getElementById("detailArtist").textContent = row.dataset.artist;
        document.getElementById("detailMemo").value = row.dataset.memo;
        document.getElementById("detailMemoForm").action = row.dataset.memoAction;
        document.getElementById("detailDeleteForm").action = row.dataset.deleteAction;
        document.getElementById("detailUserButton").textContent = row.dataset.user + " →";
        document.getElementById("detailMeta").replaceChildren(
            document.createTextNode("등록 " + row.dataset.registered + " · 작성자 " + row.dataset.user + " (" + row.dataset.userId + ") · " + row.dataset.platform),
            document.createElement("br"),
            document.createTextNode("메모 저장과 삭제 액션은 운영 기록에 남습니다")
        );
    }

    rows.forEach(row => {
        row.addEventListener("click", () => selectRow(row));
    });

    document.getElementById("detailDeleteForm")?.addEventListener("submit", event => {
        if (!confirm("이 킬링파트를 삭제하시겠습니까?")) {
            event.preventDefault();
        }
    });

</script>
</body>
</html>
