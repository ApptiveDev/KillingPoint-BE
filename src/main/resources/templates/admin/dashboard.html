<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #f4f4f1;
            color: #1a1a17;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            background: #f4f4f1;
        }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            padding: 24px 18px;
            background: #121210;
            color: #ededea;
        }

        .logo {
            display: block;
            width: 98px;
            height: auto;
            margin: 0 0 36px;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 12px 10px;
            border-left: 3px solid #c7f23f;
            background: #1c1c19;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .content {
            flex: 1;
            padding: 34px 40px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding-bottom: 24px;
            border-bottom: 1px solid #deded8;
        }

        .title {
            margin: 0;
            color: #16160f;
            font-size: 26px;
            font-weight: 800;
        }

        .logout-button {
            padding: 10px 16px;
            border: 1px solid #d2d2cb;
            border-radius: 0;
            background: #fff;
            color: #16160f;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }

        .logout-button:hover {
            border-color: #16160f;
        }

        .empty-panel {
            margin-top: 28px;
            padding: 28px;
            border: 1px solid #e7e7e2;
            background: #fff;
        }

        .empty-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        @media (max-width: 780px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .content {
                padding: 28px 20px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<main class="layout">
    <aside class="sidebar">
        <img class="logo" th:src="@{/admin/images/killing-part-logo.svg}" alt="Killing Part">
        <span class="nav-item">Admin</span>
    </aside>

    <section class="content">
        <header class="topbar">
            <h1 class="title">관리자 페이지</h1>
            <form th:action="@{/admin/logout}" method="post">
                <button class="logout-button" type="submit">로그아웃</button>
            </form>
        </header>

        <section class="empty-panel">
            <p class="empty-title">관리자 세션이 활성화되었습니다.</p>
        </section>
    </section>
</main>
</body>
</html>
