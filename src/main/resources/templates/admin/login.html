<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #101010;
            color: #1a1a17;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .login-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            background: #101010;
        }

        .brand-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px;
            background: #0e0e0e;
            color: #ceff43;
        }

        .brand-logo {
            display: block;
            width: min(340px, 78%);
            height: auto;
        }

        .form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #f6f6f3;
        }

        .login-form {
            width: 100%;
            max-width: 360px;
        }

        .title {
            margin: 0 0 28px;
            color: #16160f;
            font-size: 24px;
            font-weight: 800;
        }

        .field {
            display: block;
            margin-top: 14px;
        }

        .field-label {
            display: block;
            color: #5a5a54;
            font-size: 12px;
            font-weight: 600;
        }

        .input {
            width: 100%;
            margin-top: 7px;
            padding: 12px 14px;
            border: 1px solid #dcdcd5;
            border-radius: 0;
            background: #fff;
            color: #16160f;
            font: inherit;
            font-size: 14px;
        }

        .input:focus {
            border-color: #16160f;
            outline: none;
        }

        .error {
            margin: 14px 0 0;
            padding: 10px 12px;
            border: 1px solid #ecc3bc;
            background: #fdf1ef;
            color: #bf4a3c;
            font-size: 13px;
            line-height: 1.45;
        }

        .button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 0;
            background: #c7f23f;
            color: #16170b;
            cursor: pointer;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
        }

        .button:hover {
            background: #bce92f;
        }

        @media (max-width: 780px) {
            .login-page {
                grid-template-columns: 1fr;
            }

            .brand-panel {
                min-height: 38vh;
                padding: 40px 24px;
            }

            .form-panel {
                min-height: 62vh;
                padding: 32px 20px;
            }
        }
    </style>
</head>
<body>
<main class="login-page">
    <section class="brand-panel" aria-label="Killing Part Admin">
        <img class="brand-logo" th:src="@{/admin/images/killing-part-logo.svg}" alt="Killing Part">
    </section>

    <section class="form-panel">
        <form class="login-form" th:action="@{/admin/login}" th:object="${adminLoginRequest}" method="post">
            <h1 class="title">관리자 로그인</h1>

            <label class="field">
                <span class="field-label">관리자 ID</span>
                <input class="input" type="text" th:field="*{adminId}" autocomplete="username">
            </label>
            <p class="error" th:if="${#fields.hasErrors('adminId')}" th:errors="*{adminId}">관리자 ID를 입력해주세요.</p>

            <label class="field">
                <span class="field-label">비밀번호</span>
                <input class="input" type="password" th:field="*{password}" autocomplete="current-password" placeholder="••••••••">
            </label>
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호를 입력해주세요.</p>

            <p class="error" th:if="${loginError}" th:text="${loginError}">로그인에 실패했습니다.</p>

            <button class="button" type="submit">로그인</button>
        </form>
    </section>
</main>
</body>
</html>
